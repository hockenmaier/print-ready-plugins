name: Validate plugin distribution
on:
  push:
    branches: [main, 'codex/generated-claude-dev-*', 'codex/generated-plugins-dev-*', 'codex/publish-plugins-*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/validate.mjs
      - run: node scripts/package.mjs
      - name: Validate with Anthropic's official CLI
        run: npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate plugins/claude-dev
      - name: Validate production Claude manifest
        run: npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate plugins/claude
      - name: Install with the official Gemini CLI
        run: npx --yes @google/gemini-cli@0.66.0 extensions install . --consent
      - name: Verify installed Gemini extension
        run: npx --yes @google/gemini-cli@0.66.0 extensions list
  open-update:
    if: github.event_name == 'push' && (startsWith(github.ref_name, 'codex/generated-claude-dev-') || startsWith(github.ref_name, 'codex/generated-plugins-dev-') || startsWith(github.ref_name, 'codex/publish-plugins-'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/open-update-pr.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_BRANCH: ${{ github.ref_name }}
